<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <nav>
      <a href="#">HOME</a>
      <a href="list.html">SHOP</a>
      <a href="#">ABOUT</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <main class="container">

    <p id="pageInfo">Page 1 of 3</p>

    <nav class="pagination">
      <button id="prevBtn">Previous</button>
      <div id="pageNumbers"></div>
      <button id="nextBtn">Next</button>
    </nav>

    <div id="productList" class="product-list">
    </div>


<div class="product-item">
  <a href="goods.html">
    <img src="img/sample.png" alt="product">
  </a>
</div>

  </main>

  <footer class="footer">
    <p>© 2023 Your Store. All Rights Reserved.</p>
    <p>Privacy Policy | Terms of Service</p>
    <p>宮城 海 / 学籍番号: XXXXXXXX</p>
  </footer>

  <script>
const productList = document.getElementById("productList");
const pageNumbers = document.getElementById("pageNumbers");
const pageInfo = document.getElementById("pageInfo");

let products = JSON.parse(localStorage.getItem("products")) || [];

let currentPage = 1;
const itemsPerPage = 3;

function displayProducts() {
  productList.innerHTML = "";

  const start = (currentPage - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const paginatedItems = products.slice(start, end);

  paginatedItems.forEach((product, index) => {
    const div = document.createElement("div");
    div.classList.add("product-item");

    div.innerHTML = `
    <img src="${product.image}" class="product-img">

      <div class="product-info">
        <h3>${product.name}</h3>
        <p class="price">¥${product.price}</p>
        <p class="desc">${product.desc}</p>
        <button onclick="deleteProduct(${start + index})">削除</botton>
      </div>
    `;

    productList.appendChild(div);
  });

  pageInfo.textContent = `Page ${currentPage} of ${Math.ceil(products.length / itemsPerPage)}`;
}

function setupPagination() {
  pageNumbers.innerHTML = "";
  const totalPages = Math.ceil(products.length / itemsPerPage);

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;

    btn.addEventListener("click", () => {
      currentPage = i;
      displayProducts();
    });

    pageNumbers.appendChild(btn);
  }

   document.getElementById("prevBtn").disabled = currentPage === 1;
  document.getElementById("nextBtn").disabled = currentPage === totalPages;
}

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentPage > 1) {
    currentPage--;
    displayProducts();
    setupPagination();
  }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentPage < Math.ceil(products.length / itemsPerPage)) {
    currentPage++;
    displayProducts();
    setupPagination();
  }
});

displayProducts();
setupPagination();

function deleteProduct(index) {
  products.splice(index, 1);
  localStorage.setItem("products", JSON.stringify(products));

  if (currentPage > Math.ceil(products.length / itemsPerPage)) {
    currentPage--;
  }

  displayProducts();
  setupPagination();
}
</script>

</body>

</html>
