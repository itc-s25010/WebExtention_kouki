
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>商品登録</title>
</head>

<body>
  <header class="navbar">
    <ul>
      <li><a href="#">HOME</a></li>
      <li><a href="list.html">SHOP</a></li>
      <li><a href="#">ABOUT</a></li>
    </ul>
  </header>
<main class="container">

<div class="upload-wrapper">
  <label for="image" class="upload-area">
    <p class="upload-title">Product Image(s) Upload Area</p>
    <span class="upload-btn">Upload Images</span>
    <img id="preview" class="preview-img" />
  </label>

  <input type="file" id="image" name="image" accept="image/*" multiple>
</div>

<form action="list.html" method="post" id="productForm" class="product-form">

  <div class="form-group">
    <label>Product Name</label>
    <input type="text" name="name">
  </div>

  <div class="form-group">
    <label>Price (¥)</label>
    <input type="number" name="price">
  </div>

  <div class="form-group">
    <label>Product Description</label>
    <textarea name="desc" rows="4"></textarea>
  </div>

  <button class="submit-btn" type="submit">Add Product</button>

</form>
  </main>

<footer class="footer">
    <p>© 2023 Your Store. All Rights Reserved.</p>
    <p>Privacy Policy | Terms of Service</p>
    <p>宮城 海 / 学籍番号: XXXXXXXX</p>
  </footer>

  <script>
document.getElementById("productForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.querySelector("input[name='name']").value;
  const price = document.querySelector("input[name='price']").value;
  const desc = document.querySelector("textarea[name='desc']").value;

  const imageFile = document.getElementById("image").files[0];

  if(!imageFile){
    alert("画像を選択してください");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event){

  const product = {
    name: name,
    price: price,
    desc: desc,
    image: event.target.result
  };

  let products = JSON.parse(localStorage.getItem("products")) || [];
  products.push(product);

  localStorage.setItem("products", JSON.stringify(products));

  window.location.href = "list.html";
};

reader.readAsDataURL(imageFile);
});

document.getElementById("image").addEventListener("change", function(){

  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const preview = document.getElementById("preview");
    preview.src = e.target.result;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
});
</script>
</body>
</html>
